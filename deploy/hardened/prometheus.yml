global:
  scrape_interval: 15s
scrape_configs:
  - job_name: backend
    authorization:
      credentials_file: /run/security/metrics-token
    static_configs:
      - targets: ['backend:8000']
  - job_name: telemetry-producer
    static_configs:
      - targets: ['telemetry-producer:9104']
  - job_name: telemetry-consumer
    static_configs:
      - targets: ['telemetry-consumer:9105']
  - job_name: ml-inference
    static_configs:
      - targets: ['ml-inference:9101']
  - job_name: storage-sink
    static_configs:
      - targets: ['storage-sink:9102']
  - job_name: alert-engine
    static_configs:
      - targets: ['alert-engine:9103']
  - job_name: threat-intelligence-engine
    static_configs:
      - targets: ['threat-intelligence-engine:9106']
