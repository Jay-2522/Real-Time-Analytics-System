services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: streaming-analytics-cowrie
    restart: unless-stopped
    ports:
      - "22:2222"
    environment:
      COWRIE_HONEYPOT_TIMEZONE: UTC
      COWRIE_HONEYPOT_LOGTYPE: plain
      COWRIE_OUTPUT_JSONLOG_ENABLED: "true"
      COWRIE_TELNET_ENABLED: "false"
    volumes:
      - ./var:/cowrie/cowrie-git/var
      - cowrie-etc:/cowrie/cowrie-git/etc
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cowrie-etc:
