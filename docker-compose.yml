services:
  zookeeper:
    container_name: streaming-analytics-zookeeper
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost 2181"]
      interval: 10s
      timeout: 10s
      retries: 12
    ports:
      - "127.0.0.1:2181:2181"
    networks:
      - streaming-analytics-network
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  kafka:
    container_name: streaming-analytics-kafka
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: streaming-analytics-zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://streaming-analytics-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 120000
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - streaming-analytics-network
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-init:
    container_name: streaming-analytics-kafka-init
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        set -e
        kafka-topics --bootstrap-server streaming-analytics-kafka:29092 --create --if-not-exists --topic telemetry.login.events --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server streaming-analytics-kafka:29092 --create --if-not-exists --topic telemetry.api.events --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server streaming-analytics-kafka:29092 --create --if-not-exists --topic telemetry.network.events --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server streaming-analytics-kafka:29092 --create --if-not-exists --topic telemetry.anomaly.events --partitions 2 --replication-factor 1
        kafka-topics --bootstrap-server streaming-analytics-kafka:29092 --create --if-not-exists --topic telemetry.deadletter.events --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server streaming-analytics-kafka:29092 --create --if-not-exists --topic analytics.enriched.events --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server streaming-analytics-kafka:29092 --create --if-not-exists --topic analytics.window.metrics --partitions 2 --replication-factor 1
        kafka-topics --bootstrap-server streaming-analytics-kafka:29092 --create --if-not-exists --topic analytics.risk.metrics --partitions 2 --replication-factor 1
        kafka-topics --bootstrap-server streaming-analytics-kafka:29092 --create --if-not-exists --topic analytics.feature.engineering --partitions 2 --replication-factor 1
        kafka-topics --bootstrap-server streaming-analytics-kafka:29092 --create --if-not-exists --topic ml.anomaly.predictions --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server streaming-analytics-kafka:29092 --list
    networks:
      - streaming-analytics-network

  kafka-ui:
    container_name: streaming-analytics-kafka-ui
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local-streaming-analytics
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: streaming-analytics-kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: streaming-analytics-zookeeper:2181
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - streaming-analytics-network

  postgres:
    container_name: streaming-analytics-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: streaming_analytics
      POSTGRES_USER: streaming_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/setup_local.py first}
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISHED_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streaming_user -d streaming_analytics"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - streaming-analytics-network

  redis:
    container_name: streaming-analytics-redis
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data
    networks:
      - streaming-analytics-network

  elasticsearch:
    container_name: streaming-analytics-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - streaming-analytics-network

  backend:
    container_name: streaming-analytics-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      ENVIRONMENT: development
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      DATABASE_URL: postgresql+psycopg://streaming_user:${POSTGRES_PASSWORD:?Run python3 scripts/setup_local.py first}@streaming-analytics-postgres:5432/streaming_analytics
      ELASTICSEARCH_HOST: http://streaming-analytics-elasticsearch:9200
      REDIS_URL: redis://streaming-analytics-redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${DEV_BIND_ROOT:-.}/backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - streaming-analytics-network

  frontend:
    container_name: streaming-analytics-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ${DEV_BIND_ROOT:-.}/frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    networks:
      - streaming-analytics-network

  telemetry-producer:
    container_name: streaming-analytics-producer
    build:
      context: ./kafka-producers
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: streaming-analytics-kafka:29092
      EVENT_RATE_PER_SECOND: 5
      ANOMALY_RATE: 0.05
      PRODUCER_LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:9104:9104"
    command: python -m app.main producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - streaming-analytics-network

  telemetry-consumer:
    container_name: streaming-analytics-consumer
    build:
      context: ./kafka-producers
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: streaming-analytics-kafka:29092
      KAFKA_CONSUMER_GROUP: streaming-analytics-telemetry-consumers
      CONSUMER_LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:9105:9105"
    command: python -m app.main consumer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - streaming-analytics-network

  spark-master:
    container_name: streaming-analytics-spark-master
    image: apache/spark:3.5.3
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "0.0.0.0", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:8081:8080"
    networks:
      - streaming-analytics-network

  spark-worker:
    container_name: streaming-analytics-spark-worker
    image: apache/spark:3.5.3
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://streaming-analytics-spark-master:7077", "--cores", "2", "--memory", "2G", "--webui-port", "8081"]
    ports:
      - "127.0.0.1:8082:8081"
    networks:
      - streaming-analytics-network

  spark-streaming:
    container_name: streaming-analytics-spark-streaming
    build:
      context: ./spark-jobs
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      SPARK_KAFKA_BOOTSTRAP_SERVERS: streaming-analytics-kafka:29092
      SPARK_CHECKPOINT_ROOT: /opt/spark/checkpoints
      SPARK_STARTING_OFFSETS: latest
      SPARK_MAX_OFFSETS_PER_TRIGGER: 5000
      SPARK_TRIGGER_PROCESSING_TIME: 15 seconds
      SPARK_WATERMARK_DELAY: 2 minutes
      SPARK_LOG_LEVEL: WARN
    ports:
      - "127.0.0.1:4040:4040"
    volumes:
      - spark_checkpoints:/opt/spark/checkpoints
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
    restart: unless-stopped
    networks:
      - streaming-analytics-network

  ml-inference:
    container_name: streaming-analytics-ml-inference
    build:
      context: .
      dockerfile: ml-models/Dockerfile
    env_file:
      - ./.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: streaming-analytics-kafka:29092
      ML_CONSUMER_GROUP: streaming-analytics-ml-inference
      ML_LOG_LEVEL: INFO
      ML_ARTIFACT_DIR: /app/artifacts/contract-v2
      ML_MODEL_NAME: isolation_forest_anomaly_detector
      ML_MODEL_VERSION: 0.2.0
      ML_PREDICTION_TOPIC: ml.anomaly.predictions
      ML_AUTO_BOOTSTRAP_MODEL: "true"
      ML_TRAINING_SAMPLE_SIZE: 12000
      ML_CONTAMINATION: 0.06
    ports:
      - "127.0.0.1:9101:9101"
    command: python -m app.main inference
    volumes:
      - ${DEV_BIND_ROOT:-.}/ml-models/artifacts:/app/artifacts
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      spark-streaming:
        condition: service_started
    restart: unless-stopped
    networks:
      - streaming-analytics-network

  storage-sink:
    container_name: streaming-analytics-storage-sink
    build:
      context: .
      dockerfile: storage-sink/Dockerfile
    env_file:
      - ./.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: streaming-analytics-kafka:29092
      STORAGE_SINK_CONSUMER_GROUP: streaming-analytics-storage-sink
      STORAGE_SINK_LOG_LEVEL: INFO
      POSTGRES_HOST: streaming-analytics-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: streaming_analytics
      POSTGRES_USER: streaming_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/setup_local.py first}
      REDIS_HOST: streaming-analytics-redis
      REDIS_PORT: 6379
      ELASTICSEARCH_HOST: http://streaming-analytics-elasticsearch:9200
    ports:
      - "127.0.0.1:9102:9102"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    restart: unless-stopped
    networks:
      - streaming-analytics-network

  alert-engine:
    container_name: streaming-analytics-alert-engine
    build:
      context: .
      dockerfile: alert-engine/Dockerfile
    env_file:
      - ./.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: streaming-analytics-kafka:29092
      ALERT_ENGINE_CONSUMER_GROUP: streaming-analytics-alert-engine
      ALERT_ENGINE_LOG_LEVEL: INFO
      POSTGRES_HOST: streaming-analytics-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: streaming_analytics
      POSTGRES_USER: streaming_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/setup_local.py first}
      REDIS_HOST: streaming-analytics-redis
      REDIS_PORT: 6379
      ELASTICSEARCH_HOST: http://streaming-analytics-elasticsearch:9200
      ALERT_DEDUP_COOLDOWN_SECONDS: 120
      INCIDENT_CORRELATION_WINDOW_SECONDS: 900
    ports:
      - "127.0.0.1:9103:9103"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      ml-inference:
        condition: service_started
    restart: unless-stopped
    networks:
      - streaming-analytics-network

  threat-intelligence-engine:
    container_name: streaming-analytics-threat-intelligence-engine
    build:
      context: .
      dockerfile: threat-intelligence-engine/Dockerfile
    env_file:
      - ./.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: streaming-analytics-kafka:29092
      THREAT_INTEL_CONSUMER_GROUP: streaming-analytics-threat-intelligence
      THREAT_INTEL_LOG_LEVEL: INFO
      POSTGRES_HOST: streaming-analytics-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: streaming_analytics
      POSTGRES_USER: streaming_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/setup_local.py first}
      REDIS_HOST: streaming-analytics-redis
      REDIS_PORT: 6379
      ELASTICSEARCH_HOST: http://streaming-analytics-elasticsearch:9200
      DETECTION_RULES_PATH: /app/rules
      THREAT_INTEL_METRICS_PORT: 9106
    ports:
      - "127.0.0.1:9106:9106"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      ml-inference:
        condition: service_started
      alert-engine:
        condition: service_started
    restart: unless-stopped
    networks:
      - streaming-analytics-network

  prometheus:
    container_name: streaming-analytics-prometheus
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ${DEV_BIND_ROOT:-.}/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
      - ml-inference
      - storage-sink
      - alert-engine
      - threat-intelligence-engine
    networks:
      - streaming-analytics-network

  grafana:
    container_name: streaming-analytics-grafana
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run python3 scripts/setup_local.py first}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PUBLISHED_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ${DEV_BIND_ROOT:-.}/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${DEV_BIND_ROOT:-.}/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - streaming-analytics-network

networks:
  streaming-analytics-network:
    name: streaming-analytics-network
    driver: bridge

volumes:
  frontend_node_modules:
    name: streaming-analytics-frontend-node-modules
  kafka_data:
    name: streaming-analytics-kafka-data
  zookeeper_data:
    name: streaming-analytics-zookeeper-data
  zookeeper_log:
    name: streaming-analytics-zookeeper-log
  spark_checkpoints:
    name: streaming-analytics-spark-checkpoints
  postgres_data:
    name: streaming-analytics-postgres-data
  redis_data:
    name: streaming-analytics-redis-data
  elasticsearch_data:
    name: streaming-analytics-elasticsearch-data
  prometheus_data:
    name: streaming-analytics-prometheus-data
  grafana_data:
    name: streaming-analytics-grafana-data
