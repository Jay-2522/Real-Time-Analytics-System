global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["streaming-analytics-prometheus:9090"]

  - job_name: backend
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/backend_metrics_token
    static_configs:
      - targets: ["streaming-analytics-backend:8000"]

  - job_name: ml-inference
    static_configs:
      - targets: ["streaming-analytics-ml-inference:9101"]

  - job_name: storage-sink
    static_configs:
      - targets: ["streaming-analytics-storage-sink:9102"]

  - job_name: alert-engine
    static_configs:
      - targets: ["streaming-analytics-alert-engine:9103"]

  - job_name: telemetry-producer
    static_configs:
      - targets: ["streaming-analytics-producer:9104"]

  - job_name: threat-intelligence-engine
    static_configs:
      - targets: ["streaming-analytics-threat-intelligence-engine:9106"]
